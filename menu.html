<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Menu</title>
  <base href="/">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Berkshire+Swash&family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=Kaushan+Script&family=Lobster&family=Pacifico&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=104">
  <style>
    #pageLoaderOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      background-color: #ffffff;
      z-index: 999999;
      pointer-events: auto;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #pageLoaderOverlay.dissolve {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .page-loader-branding {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      min-height: 80px;
      padding: 0 20px;
      box-sizing: border-box;
      max-width: 90vw;
    }
    .page-loader-logo {
      max-width: min(240px, 72vw);
      max-height: 100px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.08));
    }
    .page-loader-title {
      font-family: var(--name-font, 'Lobster', cursive, sans-serif);
      font-size: clamp(2rem, 7vw, 2.75rem);
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--brand-color, #1e293b);
      line-height: 1.25;
      text-align: center;
      margin: 0;
      padding: 0;
      word-break: break-word;
    }
    .page-loader-spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid #ede8e1;
      border-top-color: var(--brand-color, #991e2e);
      border-radius: 50%;
      animation: pageLoaderSpin 0.8s linear infinite;
      margin-top: 32px;
    }
    @keyframes pageLoaderSpin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var slug = "";
        if (path.indexOf("/r/") === 0) {
          var parts = path.slice(3).split("/").filter(Boolean);
          if (parts.length > 0) slug = parts[0];
        }
        if (!slug) {
          var params = new URLSearchParams(window.location.search);
          slug = params.get("restaurant") || params.get("r") || "royal-food-corner";
        }
        var raw = localStorage.getItem("menu_brand_" + slug);
        if (raw) {
          var b = JSON.parse(raw);
          if (b) {
            if (b.accentColor) {
              document.documentElement.style.setProperty("--brand-color", b.accentColor);
            }
            if (b.nameFont) {
              var fontMap = {
                "Lobster": "'Lobster', cursive, sans-serif",
                "Bebas Neue": "'Bebas Neue', sans-serif",
                "Google Sans": "'Google Sans', sans-serif",
                "Berkshire Swash": "'Berkshire Swash', cursive, serif",
                "Kaushan Script": "'Kaushan Script', cursive"
              };
              var rf = fontMap[b.nameFont] || ("'" + b.nameFont + "', cursive, sans-serif");
              document.documentElement.style.setProperty("--name-font", rf);
            }
            document.addEventListener("DOMContentLoaded", function() {
              var logoEl = document.getElementById("pageLoaderLogo");
              var titleEl = document.getElementById("pageLoaderTitle");
              if (b.logoUrl && logoEl) {
                logoEl.src = b.logoUrl;
                logoEl.alt = b.name ? (b.name + " Logo") : "Business Logo";
                logoEl.style.display = "block";
                if (titleEl) {
                  titleEl.textContent = b.name || "";
                  titleEl.style.display = "none";
                }
              } else if (b.name && titleEl) {
                titleEl.textContent = b.name;
                titleEl.style.display = "block";
                if (logoEl) logoEl.style.display = "none";
              }
            });
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">
  <!-- Full-Screen Pre-loader with Restaurant Logo/Name & Spinner -->
  <div id="pageLoaderOverlay" class="page-loader-overlay" aria-hidden="true">
    <div class="page-loader-branding" id="pageLoaderBranding">
      <img id="pageLoaderLogo" class="page-loader-logo" src="" alt="Business Logo" style="display: none;" onerror="this.style.display='none'; var t=document.getElementById('pageLoaderTitle'); if(t && t.textContent){t.style.display='block';}">
      <h1 id="pageLoaderTitle" class="page-loader-title" style="display: none;"></h1>
    </div>
    <div class="page-loader-spinner" aria-hidden="true"></div>
  </div>

  <div class="mobile-app">
    <!-- Sticky Top Name Bar -->
    <header class="sticky-header" id="stickyHeader">
      <img id="brandLogo" class="brand-logo" src="" alt="Business Logo" style="display: none;">
      <h1 class="brand-title" id="brandTitle">&nbsp;</h1>
    </header>

    <!-- Main View Area (Stage for Category Blocks) -->
    <main class="main-content" id="mainContent">
      <div class="category-block" id="categoryBlock">
        <!-- Fixed Space Category Panel Above the Menu -->
        <div class="category-panel">
          <h2 class="category-heading" id="categoryHeading" title="Click to browse categories" role="button" tabindex="0">
            <span class="cat-heading-text">&nbsp;</span>
          </h2>
        </div>

        <!-- Scrollable Menu Card Container -->
        <div class="menu-card-container">
          <div class="menu-scroll-box" id="menuScrollBox" role="list">
            <!-- Populated by script.js -->
          </div>
        </div>
      </div>
      <!-- Vertical Dot Page Scroll Points (Category Pagination) -->
      <nav class="category-page-dots" id="categoryPageDots" aria-label="Category Navigation Dots"></nav>
    </main>

    <!-- Fixed Bottom Button Bar -->
    <footer class="bottom-bar">
      <button class="browse-btn" id="browseBtn">
        <span class="browse-btn-text">BROWSE CATEGORIES</span>
        <svg class="browse-chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 12L12 6L18 12"/>
          <path d="M6 19L12 13L18 19"/>
        </svg>
      </button>
      <button class="platter-btn" id="platterBtn" aria-label="View Platter" title="View Selected Dishes">
        <div class="platter-icon-wrapper">
          <img src="/assets/platter.png" alt="Platter" class="platter-icon-img">
          <span class="platter-count" id="platterCount">0</span>
        </div>
      </button>
    </footer>

    <!-- Categories Modal / Bottom Sheet -->
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="category-sheet" id="categorySheet" role="dialog" aria-label="Select Category">
      <div class="sheet-header">
        <h3>Select Category</h3>
        <button class="close-sheet-btn" id="closeSheetBtn">&times;</button>
      </div>
      <div class="sheet-list" id="categorySheetList">
        <!-- Injected via script.js -->
      </div>
    </div>

    <!-- Platter Review Dialog / Bottom Sheet (Theme-consistent) -->
    <div class="modal-backdrop" id="platterBackdrop"></div>
    <div class="platter-sheet" id="platterSheet" role="dialog" aria-label="My Platter">
      <div class="sheet-header">
        <div class="platter-sheet-title">
          <h3>My Platter (<span id="platterDialogCount">0</span>)</h3>
        </div>
        <button class="close-sheet-btn" id="closePlatterBtn">&times;</button>
      </div>
      <div class="platter-list" id="platterList">
        <!-- Injected via script.js: Selected dish names only -->
      </div>
      <div class="platter-footer" id="platterFooter">
        <button class="clear-platter-btn" id="clearPlatterBtn">Clear Platter</button>
      </div>
    </div>
  </div>

  <script src="/script.js?v=64"></script>
</body>
</html>
